<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <filter id="grain" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="4" stitchTiles="stitch" result="noise"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.94  0 0 0 0 0.90  0 0 0 0 0.82  0 0 0 0.12 0" in="noise" result="coloredNoise"/>
      <feMerge>
        <feMergeNode in="coloredNoise"/>
      </feMerge>
    </filter>
    <filter id="speckle" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feTurbulence type="turbulence" baseFrequency="0.9 0.9" numOctaves="2" stitchTiles="stitch" result="noise2"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.72  0 0 0 0 0.68  0 0 0 0 0.60  0 0 0 0.06 0" in="noise2"/>
    </filter>
  </defs>
  <rect width="400" height="400" fill="#F2EAD8"/>
  <rect width="400" height="400" filter="url(#grain)" opacity="1"/>
  <rect width="400" height="400" filter="url(#speckle)" opacity="0.7"/>
</svg>
